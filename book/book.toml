[book]
title = "用 Rust 造一个 Codex"
authors = ["王智勇"]
language = "zh"
description = "AI Agent 系统设计与 AI 软件工程——从零到自举，用 Rust 逐步实现一个 mini-codex。"
src = "src"

[output.html]
git-repository-url = "https://github.com/0end1/codex-in-rust"
