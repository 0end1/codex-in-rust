# 第 2 章结束态：mini-codex 由单包改造成 workspace（根只管编排）。
# 依赖在 [workspace.dependencies] 统一锁一次，子 crate 一律 workspace = true。
# 依赖方向（2.4 节，编译器替我们守架构）：
#   mcx-cli → 依赖所有 crate
#   mcx-core → protocol / tools / sandbox
#   mcx-tools → protocol / sandbox
#   mcx-sandbox → protocol
#   mcx-protocol → 不依赖任何 workspace 内 crate
[workspace]
resolver = "2"
members = [
    "crates/mcx-cli",
    "crates/mcx-core",
    "crates/mcx-protocol",
    "crates/mcx-tools",
    "crates/mcx-sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
