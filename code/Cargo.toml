# 第 1 章结束态：mini-codex 单包（非 workspace）。
# 第 2 章会把这里改造成 [workspace] 并把源码拆进 crates/。
# 依赖版本在此精确书写一次；进入 workspace 后收敛到 [workspace.dependencies]。
[package]
name = "mini-codex"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
